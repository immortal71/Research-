[project]
name = "rnasig"
version = "0.1.0"
description = "Signature-based discovery pipeline for novel RNA biological entities in public metatranscriptomes"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
